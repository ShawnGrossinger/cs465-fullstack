<div class="row">
  <div class="col-12 col-md-8">
    <h2>Login</h2>
    <div role="status" *ngIf="notice && !formError" class="alert alert-info">
      {{ notice }}
    </div>
    <form (ngSubmit)="onLoginSubmit()">
      <div role="alert" *ngIf="formError" class="alert alert-danger">
        {{ formError }}
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" class="form-control" id="email" name="email"
               placeholder="Enter email address" autocomplete="username"
               [(ngModel)]="credentials.email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" class="form-control" id="password"
               name="password" placeholder="Password" autocomplete="current-password"
               [(ngModel)]="credentials.password">
      </div>
      <button type="submit" role="button" class="btn btn-primary mt-2">
        Sign In!
      </button>
    </form>
  </div>
</div>
